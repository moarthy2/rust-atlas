name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
      - run: cargo test --locked

  build-linux-windows:
    name: Build ${{ matrix.name }}
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: native
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: cross
          - name: windows-x86_64
            target: x86_64-pc-windows-gnu
            runner: cross
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: matrix.runner == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        run: |
          if [ "${{ matrix.runner }}" = cross ]; then
            cross build --locked --release --target "${{ matrix.target }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          [ "${{ matrix.target }}" = x86_64-pc-windows-gnu ] && ext=\.exe
          cp "target/${{ matrix.target }}/release/rust-docs-bot${ext}" "dist/rust-atlas-${{ matrix.name }}${ext}"
          cp .env.example dist/
          tar -C dist -czf "rust-atlas-${{ matrix.name }}.tar.gz" "rust-atlas-${{ matrix.name }}${ext}" .env.example
      - uses: actions/upload-artifact@v4
        with:
          name: rust-atlas-${{ matrix.name }}
          path: dist/rust-atlas-${{ matrix.name }}.tar.gz

  build-macos:
    name: Build ${{ matrix.name }}
    needs: check
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            target: aarch64-apple-darwin
          - name: macos-x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rust-docs-bot dist/rust-atlas-${{ matrix.name }}
          cp .env.example dist/
          tar -C dist -czf rust-atlas-${{ matrix.name }}.tar.gz rust-atlas-${{ matrix.name }} .env.example
      - uses: actions/upload-artifact@v4
        with:
          name: rust-atlas-${{ matrix.name }}
          path: dist/rust-atlas-${{ matrix.name }}.tar.gz

  build-android:
    name: Build Android ARM64
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
      - name: Build
        env:
          NDK: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64
        run: |
          export CC_aarch64_linux_android="$NDK/bin/aarch64-linux-android21-clang"
          export CXX_aarch64_linux_android="$NDK/bin/aarch64-linux-android21-clang++"
          export AR_aarch64_linux_android="$NDK/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/bin/aarch64-linux-android21-clang"
          cargo build --locked --release --target aarch64-linux-android
      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-linux-android/release/rust-docs-bot dist/rust-atlas-android-arm64
          cp .env.example dist/
          tar -C dist -czf rust-atlas-android-arm64.tar.gz rust-atlas-android-arm64 .env.example
      - uses: actions/upload-artifact@v4
        with:
          name: rust-atlas-android-arm64
          path: dist/rust-atlas-android-arm64.tar.gz

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-windows, build-macos, build-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-atlas-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
